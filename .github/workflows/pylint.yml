name: Code Style Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django social-auth-app-django pylint pylint-django

    - name: Run Pylint
      run: |
        pylint --load-plugins=pylint_django --ignore=migrations,venv,.venv-6 auth_project/ users/