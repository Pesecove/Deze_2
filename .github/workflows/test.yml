name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Deps
      run: |
        python -m pip install --upgrade pip
        pip install django social-auth-app-django cryptography PyJWT pyOpenSSL

    - name: Check Django Project
      run: python manage.py check || true